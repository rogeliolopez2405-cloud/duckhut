name: Bug report
description: Help us fix a problem
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows, Safari on iPhone, etc.
    validations:
      required: true
